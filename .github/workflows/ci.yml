name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Chexsa
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Check Python files
        run: python -m compileall -q agent_.py browser_.py cli_.py desktop_.py desktop_agent_.py llm_.py observations_.py voice_.py files_.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run isolated Chrome fixture without API calls
        timeout-minutes: 5
        run: python tests/browser_changes_integration_.py
