[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chexsa"
version = "0.1.0"
description = "A personal browser and Windows desktop AI agent."
requires-python = ">=3.11"

# Libraries used by the rebuilt browser and desktop tools.
dependencies = [
    "openai",
    "playwright",
    "pywinauto==0.6.9",
    "python-dotenv",
]

[project.optional-dependencies]
# Install microphone support only when trying the voice prototype.
voice = ["SpeechRecognition[audio]>=3.14,<4"]

[project.scripts]
# Both terminal modes start from the new CLI.
chexsa = "cli_:main"

[tool.setuptools]
packages = []
py-modules = [
    "agent_",
    "browser_",
    "cli_",
    "desktop_",
    "desktop_agent_",
    "llm_",
    "observations_",
    "voice_",
    "files_",
]
